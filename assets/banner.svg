<svg xmlns="http://www.w3.org/2000/svg" width="900" height="160" viewBox="0 0 900 160" role="img" aria-label="Find the Number">
  <defs>
    <linearGradient id="bg6967812" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1220"/>
      <stop offset="55%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#0B1220"/>
    </linearGradient>
    <linearGradient id="acc6967812" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22C55E">
        <animate attributeName="stop-color" values="#22C55E;#84CC16;#22C55E" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#84CC16">
        <animate attributeName="stop-color" values="#84CC16;#22C55E;#84CC16" dur="6s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <filter id="glow6967812" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="900" height="160" rx="16" fill="url(#bg6967812)"/>
  <!-- circuit grid -->
  <g opacity="0.18" stroke="#22C55E" stroke-width="1" fill="none">
    <path d="M40 40 H220 V90 H120 V150 H280"/>
    <path d="M620 50 H860 V110 H740 V160 H820"/>
    <circle cx="120" cy="90" r="3" fill="#84CC16"/>
    <circle cx="280" cy="150" r="3" fill="#22C55E"/>
    <circle cx="740" cy="110" r="3" fill="#84CC16"/>
  </g>
  <!-- pulsing orbit -->
  <g transform="translate(820,100)">
    <circle r="36" fill="none" stroke="#22C55E" stroke-width="1.5" opacity="0.35">
      <animate attributeName="r" values="28;40;28" dur="3.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.45;0.15;0.45" dur="3.5s" repeatCount="indefinite"/>
    </circle>
    <circle r="8" fill="#84CC16" filter="url(#glow6967812)">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="8s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="translate" values="0 -28;0 -28" additive="sum" dur="8s" repeatCount="indefinite"/>
    </circle>
    <circle r="4" fill="#22C55E" opacity="0.9"/>
  </g>
  <!-- accent bar -->
  <rect x="40" y="168" width="180" height="3" rx="2" fill="url(#acc6967812)">
    <animate attributeName="width" values="120;220;120" dur="4s" repeatCount="indefinite"/>
  </rect>
  <!-- title -->
  <text x="48" y="78" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Arial" font-size="36" font-weight="700" fill="#F8FAFC">Find the Number</text>
  <text x="48" y="118" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Arial" font-size="16" fill="#94A3B8">Guess 1–99 in 7 tries</text>
  <!-- scan line -->
  <rect x="0" y="0" width="900" height="2" fill="#84CC16" opacity="0.25">
    <animate attributeName="y" values="0;160;0" dur="7s" repeatCount="indefinite"/>
  </rect>
</svg>
